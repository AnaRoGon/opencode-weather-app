name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          version: latest

      - name: Obtener versión desde package.json
        id: version
        run: echo "VERSION=$(jq -r '.version' package.json)" >> "$GITHUB_ENV"

      - name: Saltar si el tag ya existe
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "El tag v$VERSION ya existe, se omite."
            exit 0
          fi

      - name: Tests
        run: bun test --parallel

      - name: Compilar binarios multi-plataforma
        run: |
          bun build --compile --target=bun-linux-x64   ./src/index.ts --outfile dist/weather-linux-x64
          bun build --compile --target=bun-windows-x64 ./src/index.ts --outfile dist/weather-windows-x64
          bun build --compile --target=bun-darwin-x64  ./src/index.ts --outfile dist/weather-darwin-x64
          bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile dist/weather-darwin-arm64

      - name: Crear release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"v$VERSION\",\"name\":\"v$VERSION\",\"generate_release_notes\":true}" \
            | jq -e '.id' > /tmp/release_id

      - name: Subir binarios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID=$(cat /tmp/release_id)
          for f in dist/*; do
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$(basename "$f")" \
              --data-binary "@$f"
          done
